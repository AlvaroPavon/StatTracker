# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# SHA-256 Base64 del certificado debug local. Permite instalar desde Android Studio
# sin relajar la comprobacion de integridad en builds firmadas con otra clave.
stattrackerDebugSignatureHashes=uQV9VYUh3xwUb9Av15JC4M01hTS2XWpwK9bvKcjvSZA=

# Configurar con el hash SHA-256 Base64 de la firma de produccion antes de publicar.
stattrackerReleaseSignatureHashes=
